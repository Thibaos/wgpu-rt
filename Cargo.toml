[package]
name = "wgpu-rt"
version = "0.1.0"
edition = "2024"
default-run = "wgpu-rt"

[dependencies]
bytemuck = "1.25"
dot_vox = "5.2"
env_logger = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
log = "0.4"
pollster = "1"
rayon = "1"
tree64 = { git = "https://github.com/expenses/tree64", version = "0.1.0" }
wgpu = { version = "30", features = ["spirv"] }
winit = "0.30"

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
