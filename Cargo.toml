[package]
name = "wgpu-rt"
version = "0.1.0"
edition = "2024"
default-run = "wgpu-rt"

[dependencies]
bytemuck = "1.25"
dot_vox = "5.2"
env_logger = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
log = "0.4"
pollster = "1"
rayon = "1"
wgpu = { version = "30", features = ["spirv"] }
winit = "0.30"

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
